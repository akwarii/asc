# main.py config.yaml example
# Run with: python main.py fit --config configs/config.yaml

seed_everything: 3

trainer:
  accelerator: auto
  devices: auto
  max_epochs: 30
  precision: bf16-mixed
  enable_model_summary: false
  logger:
    class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: logs
      name: painn_experiment
      default_hp_metric: false
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss
        mode: min
        save_top_k: 3
        filename: "{epoch}-{val_loss:.4f}"
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        patience: 20
        mode: min
    - class_path: lightning.pytorch.callbacks.BatchSizeFinder
    - class_path: lightning.pytorch.callbacks.RichModelSummary
      init_args:
        max_depth: 2

model:
  model_name: painn
  # num_classes: will be linked from data.num_classes
  lr: 0.006
  warmup: 700
  max_iters: -1  # Will be calculated automatically in main.py
  compile: true
  model_kwargs:
    hidden_channels: 32
    num_layers: 2
    num_radial: 4
  metrics:
    - class_path: torchmetrics.F1Score
    - class_path: torchmetrics.AUROC
    - class_path: torchmetrics.Accuracy
    - class_path: torchmetrics.ConfusionMatrix

data:
  dataset_name: custom
  root: examples/silicon/data
  lengths: [0.7, 0.2, 0.1]
  batch_size: 128
  num_workers: 8
  use_imbalance_sampler: true
  transforms:
    - class_path: src.transforms.RandomPerturbation
      init_args:
        std_range: [0.0, 0.05]
    - class_path: src.transforms.BoxStrain
      init_args:
        std_range: [0.0, 0.05]
        directions: all
