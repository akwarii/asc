dataset_name: csg
root: ./data/csg/
lengths: [0.7, 0.2, 0.1]
batch_size: 128
num_workers: 8
use_imbalance_sampler: true
multiprocessing_context: spawn

transforms:
  - class_path: src.transforms.RandomPerturbation
    init_args:
      std_range: [0.0, 0.05]
