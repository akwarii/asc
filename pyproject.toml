[project]
name = "asc"
version = "0.1.0"
description = "A suite for classifying atomic structures using graph neural networks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonargparse[signatures]>=4.46.0",
    "lightning>=2.6.1",
    "matplotlib>=3.10.8",
    "ovito>=3.15.0",
    "pandas>=3.0.1",
    "rich>=14.3.3",
    "setuptools==81.0", # newer versions are not compatible with tensorboard
    "tensorboard>=2.20.0",
    "torch-geometric>=2.7.0",
]

[dependency-groups]
api = ["mp-api>=0.44.0", "kaggle>=1.8.0", "python-dotenv>=1.2.0"]
hpo = [
    "cmaes>=0.12.0",
    "fvcore>=0.1.5.post20221221",
    "optuna>=4.6.0",
    "optunahub>=0.4.0",
    "optuna-dashboard>=0.20.0",
    "optuna-integration>=4.6.0",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.3",
]
dev = ["pytest>=8.3.4", "line-profiler>=5.0.0"]
notebook = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
]

[tool.ruff]
src = ["src"]
line-length = 99
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",    # flake8 rules
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8 naming
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
    "BLE",  # flake8-blind-except
    "PERF", # flake8-perf

]
ignore = [
    "N812",   # lowercase imported as non lowercase
    "D100",   # missing docstring in public module
    "D104",   # missing docstring in public package
    "D105",   # missing docstring in magic method
    "D107",   # missing docstring in __init__
    "D205",   # 1 blank line required between summary line and description
    "ANN002", # missing type annotation for *args
    "ANN003", # missing type annotation for **kwargs
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # Unused import
"tests/**" = [
    "D",   # Pydocstyle
    "ANN", # flake8-annotations
]
"notebooks/**" = [
    "D",   # Pydocstyle
    "ANN", # flake8-annotations
]
"scripts/**" = [
    "D",   # Pydocstyle
    "ANN", # flake8-annotations
]
"src/module.py" = ["D102"] # Missing docstring in public method

[tool.mypy]
exclude = "^scripts/.*\\.py$"
